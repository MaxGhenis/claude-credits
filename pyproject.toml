[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-credits"
version = "0.1.0"
description = "Keep your Claude Max plan's monthly API credit key in your OS keychain and run jobs on it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["keyring>=24"]

[project.scripts]
claude-credits = "claude_credits:main"

[tool.hatch.build.targets.wheel]
only-include = ["claude_credits.py"]

[tool.hatch.build.targets.sdist]
only-include = ["claude_credits.py", "README.md", "LICENSE", "examples", "tests", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
